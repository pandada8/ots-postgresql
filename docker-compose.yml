services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: ots
    ports:
      - "127.0.0.1:54321:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ots"]
      interval: 5s
      timeout: 5s
      retries: 30

  ots-postgresql:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: "postgres://postgres:test@postgres:5432/ots?sslmode=disable"
      OTS_LISTEN: ":8080"
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres-data:
